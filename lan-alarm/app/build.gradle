plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.example.lanalarm"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lanalarm"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.nanohttpd:nanohttpd:2.3.1"
}
